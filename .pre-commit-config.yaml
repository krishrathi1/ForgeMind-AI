repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Golden fixtures are compared byte-for-byte by
      # tests/parser/docx/test_native_docx_golden.py. Assets whose payload has
      # no binary magic bytes (e.g. a stub "pic.png" holding plain ASCII) are
      # detected as text, and appending a trailing newline breaks the
      # comparison -- so keep these hooks away from the fixture tree.
      - id: trailing-whitespace
        exclude: ^(forgemind/api/webui/|tests/parser/docx/golden/)
      - id: end-of-file-fixer
        exclude: ^(forgemind/api/webui/|tests/parser/docx/golden/)
      - id: requirements-txt-fixer
        exclude: ^forgemind/api/webui/


  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-format
        exclude: ^forgemind/api/webui/
      - id: ruff
        args: [--fix, --ignore=E402]
        exclude: ^forgemind/api/webui/


  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        stages: [manual]
        exclude: ^forgemind/api/webui/
